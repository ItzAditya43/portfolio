<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aditya — Floating Village Portfolio</title>
<style>
  :root{
    --ink: #1b1a1f;
    --paper: #f3ede2;
    --gate-red: #a6362c;
    --gate-red-bright: #c94a3c;
    --gold: #c9a35a;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#0c1220;
    font-family: Georgia, 'Times New Roman', serif;
    overflow:hidden;
    color: var(--paper);
  }
  canvas{ display:block; touch-action:none; }

  #loading{
    position:fixed; inset:0; z-index:50;
    background:#0c1220;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity 0.9s ease;
  }
  #loading .mark{ font-size:15vw; line-height:1; color: var(--gold); opacity:0.9; }
  #loading .sub{
    margin-top:14px; font-size:13px; letter-spacing:0.35em; text-transform:uppercase;
    color: rgba(243,237,226,0.55); font-family: system-ui, sans-serif;
  }
  #loading .err{
    margin-top:22px; max-width:80vw; font-size:12px; color:#e88;
    font-family: monospace; text-align:center; white-space:pre-wrap;
  }
  #loading.hidden{ opacity:0; pointer-events:none; }

  #hud{
    position:fixed; inset:0; pointer-events:none; z-index:10;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  #hud .top{ display:flex; justify-content:space-between; align-items:flex-start; padding: 24px 28px 0 28px; }
  #hud .title{ font-size:21px; letter-spacing:0.08em; color: var(--paper); text-shadow: 0 2px 18px rgba(0,0,0,0.55); }
  #hud .title small{
    display:block; font-family: system-ui, sans-serif; font-size:10px; letter-spacing:0.3em;
    text-transform:uppercase; color: rgba(243,237,226,0.55); margin-top:6px;
  }

  #season-indicator{
    display:inline-flex; align-items:center; gap:8px; margin-top:12px;
    background: rgba(12,18,32,0.4); border:1px solid rgba(243,237,226,0.15);
    border-radius:4px; padding:6px 12px; backdrop-filter: blur(6px);
    font-family: system-ui, sans-serif; pointer-events:auto;
  }
  #season-indicator .kanji{ font-size:17px; color: var(--gold); font-family: Georgia, serif; line-height:1; }
  #season-indicator #season-label{ font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color: rgba(243,237,226,0.8); }

  #watch{
    text-align:right; font-family: system-ui, sans-serif; pointer-events:auto;
    background: rgba(12,18,32,0.4); border:1px solid rgba(243,237,226,0.15);
    border-radius:4px; padding:10px 14px; backdrop-filter: blur(6px);
    display:flex; align-items:center; gap:12px;
  }
  #watch-face{ width:52px; height:52px; flex:0 0 auto; }
  #watch-face circle.rim{ fill:rgba(12,18,32,0.5); stroke:rgba(201,163,90,0.55); stroke-width:2.5; }
  #watch-face line.tick{ stroke:rgba(243,237,226,0.4); stroke-width:2; }
  #watch-face line.hand{ stroke-linecap:round; }
  #hand-hour{ stroke:var(--paper); stroke-width:4; }
  #hand-min{ stroke:var(--paper); stroke-width:2.6; }
  #hand-sec{ stroke:var(--gate-red-bright); stroke-width:1.4; }
  #watch-text{ text-align:right; }
  #digital-time{ font-size:16px; letter-spacing:0.05em; color:var(--paper); }
  #digital-date{ font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:rgba(243,237,226,0.55); margin-top:2px; }
  #daynight-label{ font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color: var(--gold); margin-top:4px; }

  #hint{
    align-self:center; margin-bottom:36px; font-family: system-ui, sans-serif; font-size:11px;
    letter-spacing:0.2em; text-transform:uppercase; color: rgba(243,237,226,0.55);
    background: rgba(12,18,32,0.35); padding:10px 18px; border-radius:2px;
    border:1px solid rgba(243,237,226,0.15); transition: opacity 0.6s ease;
  }
  #hint.hidden{ opacity:0; }

  .poi-label{
    position:absolute; transform:translate(-50%,-100%); pointer-events:auto; cursor:pointer;
    font-family: system-ui, sans-serif; font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase;
    color: rgba(243,237,226,0.85); text-shadow: 0 2px 10px rgba(0,0,0,0.75);
    padding: 3px 9px; white-space:nowrap; transition: color 0.25s ease, opacity 0.3s ease;
  }
  .poi-label:hover{ color: var(--gold); }
  .poi-label .dot{
    display:inline-block; width:5px; height:5px; border-radius:50%; background: var(--gate-red-bright);
    margin-right:6px; box-shadow: 0 0 8px 2px rgba(201,74,60,0.7);
  }
  .poi-label.npc .dot{ background:#8fc17a; box-shadow:0 0 8px 2px rgba(143,193,122,0.7); }

  #return-btn{
    position:fixed; top:24px; left:50%; transform:translateX(-50%);
    font-family: system-ui, sans-serif; font-size:11px; letter-spacing:0.25em; text-transform:uppercase;
    color: rgba(243,237,226,0.85); background: rgba(12,18,32,0.45);
    border:1px solid rgba(201,163,90,0.35); padding:9px 20px; cursor:pointer;
    opacity:0; pointer-events:none; transition: opacity 0.4s ease;
    z-index:25; backdrop-filter: blur(6px);
  }
  #return-btn.visible{ opacity:1; pointer-events:auto; }
  #return-btn:hover{ color: var(--gold); border-color: var(--gold); }

  .floating-card{
    position:absolute; width:230px; box-sizing:border-box;
    background: rgba(19,17,23,0.5);
    backdrop-filter: blur(11px);
    -webkit-backdrop-filter: blur(11px);
    border:1px solid rgba(243,237,226,0.16);
    padding:16px 18px 18px 18px;
    max-height:min(66vh, 480px); overflow-y:auto;
    transform: translate(-50%,-50%) scale(0.92);
    opacity:0; pointer-events:none;
    transition: opacity 0.55s ease, transform 0.55s ease;
    z-index:22; font-family: system-ui, sans-serif;
    left:50%; top:50%;
  }
  .floating-card::-webkit-scrollbar{ width:6px; }
  .floating-card::-webkit-scrollbar-thumb{ background: rgba(201,163,90,0.4); border-radius:3px; }

  .shrine-nav{
    position:fixed; top:50%; transform:translateY(-50%);
    width:46px; height:46px; border-radius:50%;
    background: rgba(12,18,32,0.5); border:1px solid rgba(243,237,226,0.2);
    display:flex; align-items:center; justify-content:center;
    color: var(--paper); font-size:20px; cursor:pointer;
    opacity:0; pointer-events:none; transition: opacity 0.4s ease, border-color 0.25s ease, color 0.25s ease;
    z-index:23; backdrop-filter: blur(6px); font-family: system-ui, sans-serif;
  }
  .shrine-nav.visible{ opacity:1; pointer-events:auto; }
  .shrine-nav:hover{ color: var(--gold); border-color: var(--gold); }
  .shrine-nav.left{ left:24px; }
  .shrine-nav.right{ right:24px; }
  .floating-card.visible{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
  .floating-card .eyebrow{
    font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color: var(--gold); margin-bottom:8px;
  }
  .floating-card h3{
    font-family: Georgia, serif; font-size:18px; margin:0 0 9px 0; color: var(--paper); font-weight:400;
  }
  .floating-card p{ font-size:12.5px; line-height:1.6; color: rgba(243,237,226,0.82); margin:0 0 8px 0; }
  .floating-card ul{ padding-left:16px; margin:0 0 8px 0; }
  .floating-card li{ font-size:12px; color: rgba(243,237,226,0.78); margin-bottom:6px; line-height:1.5; }
  .floating-card li a.proj-link{
    display:inline-block; margin-left:4px; font-size:10.5px; letter-spacing:0.05em;
    color: var(--gold); text-decoration:none; border-bottom:1px solid rgba(201,163,90,0.4);
    white-space:nowrap;
  }
  .floating-card li a.proj-link:hover{ color: var(--paper); border-color: var(--paper); }
  .floating-card a.link{
    display:inline-block; margin-top:4px; margin-right:14px; font-size:10px; letter-spacing:0.18em;
    text-transform:uppercase; color: var(--gold); text-decoration:none;
    border-bottom: 1px solid rgba(201,163,90,0.4); padding-bottom:2px;
  }
  .floating-card a.link:hover{ color: var(--paper); border-color: var(--paper); }
  .floating-card.wide{ width:290px; }

  /* ---- mobile layout ---- */
  @media (max-width: 640px), (max-height: 480px) {
    #hud .top{
      padding: calc(12px + env(safe-area-inset-top)) 14px 0 calc(14px + env(safe-area-inset-left));
    }
    #hud .title{ font-size:16px; }
    #hud .title small{ font-size:8px; letter-spacing:0.2em; margin-top:4px; }
    #season-indicator{ margin-top:8px; padding:4px 9px; }
    #season-indicator .kanji{ font-size:14px; }
    #watch{ padding:7px 10px; gap:8px; }
    #watch-face{ width:38px; height:38px; }
    #digital-time{ font-size:13px; }
    #digital-date{ font-size:8.5px; }
    #daynight-label{ font-size:8.5px; }
    #hint{
      margin-bottom: calc(16px + env(safe-area-inset-bottom));
      font-size:9px; padding:8px 12px; max-width:86vw; text-align:center;
    }
    .poi-label{
      font-size:9.5px; letter-spacing:0.1em;
      background: rgba(12,18,32,0.6); border:1px solid rgba(243,237,226,0.22);
      border-radius:999px; padding:7px 12px;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      max-width:62vw; overflow:hidden; text-overflow:ellipsis;
    }
    #return-btn{ top: calc(10px + env(safe-area-inset-top)); font-size:10px; padding:8px 14px; }
    .floating-card, .floating-card.wide{
      width: min(86vw, 320px);
      max-height: 58vh;
      padding:13px 14px 15px 14px;
    }
    .shrine-nav{ width:38px; height:38px; font-size:17px; }
    .shrine-nav.left{ left: calc(8px + env(safe-area-inset-left)); }
    .shrine-nav.right{ right: calc(8px + env(safe-area-inset-right)); }
    #loading .mark{ font-size:26vw; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="mark">⛩</div>
  <div class="sub">entering aditya's village</div>
  <div class="err" id="loading-err"></div>
</div>

<div id="hud">
  <div class="top">
    <div class="title">Aditya's Village<small>Drag to look around · scroll to zoom</small>
      <div id="season-indicator"><span class="kanji" id="season-kanji">春</span><span id="season-label">Spring</span></div>
    </div>
    <div id="watch">
      <div id="watch-text">
        <div id="digital-time">--:--:--</div>
        <div id="digital-date">-- --- ----</div>
        <div id="daynight-label">—</div>
      </div>
      <svg id="watch-face" viewBox="0 0 100 100">
        <circle class="rim" cx="50" cy="50" r="46"></circle>
        <line id="hand-hour" class="hand" x1="50" y1="50" x2="50" y2="28"></line>
        <line id="hand-min" class="hand" x1="50" y1="50" x2="50" y2="18"></line>
        <line id="hand-sec" class="hand" x1="50" y1="50" x2="50" y2="14"></line>
        <circle cx="50" cy="50" r="2.4" fill="var(--gold)"></circle>
      </svg>
    </div>
  </div>
  <div id="hint">Visit a shrine to explore my work · click a villager to say hi</div>
</div>

<div id="return-btn">&larr; Return to overview</div>
<div id="shrine-nav-prev" class="shrine-nav left" title="Previous shrine">&#8592;</div>
<div id="shrine-nav-next" class="shrine-nav right" title="Next shrine">&#8594;</div>
<div id="poi-labels"></div>
<div id="cards-layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VignetteShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
window.addEventListener('error', function(e){
  var el = document.getElementById('loading-err');
  if (el) el.textContent = 'Error: ' + e.message;
});

try {

/* ---------------------------------------------------------------------
   0. Tiny value-noise
--------------------------------------------------------------------- */
var NOISE_SEED = 1337;
function hash(x, y) {
  var s = Math.sin(x * 127.1 + y * 311.7 + NOISE_SEED) * 43758.5453123;
  return s - Math.floor(s);
}
function smoothT(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, y) {
  var xi = Math.floor(x), yi = Math.floor(y);
  var xf = x - xi, yf = y - yi;
  var a = hash(xi, yi), b = hash(xi + 1, yi);
  var c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  var u = smoothT(xf), v = smoothT(yf);
  return a + (b - a) * u + (c - a) * v * (1 - u) + (d - b) * u * v;
}
function fbm(x, y, octaves) {
  octaves = octaves || 4;
  var total = 0, amp = 0.5, freq = 1, max = 0;
  for (var i = 0; i < octaves; i++) {
    total += valueNoise(x * freq, y * freq) * amp;
    max += amp;
    amp *= 0.5; freq *= 2.1;
  }
  return total / max;
}
function angDist(a, b) {
  var d = Math.abs(a - b) % (Math.PI * 2);
  if (d > Math.PI) d = Math.PI * 2 - d;
  return d;
}

/* ---------------------------------------------------------------------
   0b. Procedural textures — generated in-canvas so materials read as
       real surfaces (grass, wood grain, shingles, stone) with bump maps
--------------------------------------------------------------------- */
function makeProceduralTexture(size, pixelFn, repeat) {
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var ctx = c.getContext('2d');
  var img = ctx.createImageData(size, size);
  var d = img.data;
  for (var y = 0; y < size; y++) {
    for (var x = 0; x < size; x++) {
      var rgb = pixelFn(x / size, y / size, x, y);
      var i = (y * size + x) * 4;
      d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  if (repeat) tex.repeat.set(repeat, repeat);
  PROC_TEXTURES.push(tex); // anisotropy applied once the renderer exists
  return tex;
}
var PROC_TEXTURES = [];

/* grass: neutral-bright detail (multiplies vertex colors) with blade streaks */
var grassDetailTex = makeProceduralTexture(256, function (u, v) {
  var n = fbm(u * 9, v * 9, 4);
  var streak = fbm(u * 3 + 31, v * 60 + 7, 3);          // vertical-ish blade strokes
  var val = 175 + n * 60 + (streak - 0.5) * 46;
  val = Math.max(120, Math.min(255, val));
  return [val, val + 6, val - 8];
}, 20);
var grassBumpTex = makeProceduralTexture(256, function (u, v) {
  var n = fbm(u * 14, v * 14, 4) * 0.65 + fbm(u * 3 + 31, v * 60 + 7, 3) * 0.35;
  var val = n * 255;
  return [val, val, val];
}, 20);

/* wood grain: long horizontal fibres with knotty wobble */
function woodValue(u, v) {
  var wob = fbm(u * 3, v * 12, 3) * 1.6;
  var grain = Math.sin((v * 34 + wob) * Math.PI) * 0.5 + 0.5;
  var fine = fbm(u * 40, v * 6, 3);
  return grain * 0.55 + fine * 0.45;
}
var woodTex = makeProceduralTexture(256, function (u, v) {
  var g = woodValue(u, v);
  var val = 150 + g * 100;
  return [val, val * 0.93, val * 0.85];
}, 1);
var woodBumpTex = makeProceduralTexture(256, function (u, v) {
  var g = woodValue(u, v) * 255;
  return [g, g, g];
}, 1);

/* roof shingles: horizontal rows with staggered joints + weathering */
function shingleValue(u, v) {
  var rows = 9;
  var row = Math.floor(v * rows);
  var vv = v * rows - row;
  var offs = (row % 2) * 0.5;
  var col = (u * 5 + offs);
  var cc = col - Math.floor(col);
  var edge = Math.min(1, vv * 7) * Math.min(1, (1 - vv) * 1.4);
  var joint = Math.min(1, Math.min(cc, 1 - cc) * 16);
  var weather = fbm(u * 12, v * 12 + row * 3.7, 3);
  return edge * (0.55 + joint * 0.45) * (0.7 + weather * 0.5);
}
var roofTex = makeProceduralTexture(256, function (u, v) {
  var s = shingleValue(u, v);
  var val = 90 + s * 165;
  return [val, val, val];
}, 1);
var roofBumpTex = roofTex;

/* stone: mottled fbm with crack lines */
function stoneValue(u, v) {
  var n = fbm(u * 7, v * 7, 4);
  var crack = fbm(u * 4 + 90, v * 4 + 90, 3);
  var line = Math.abs(crack - 0.5) < 0.015 ? 0.55 : 1.0;
  return (0.6 + n * 0.5) * line;
}
var stoneTex = makeProceduralTexture(256, function (u, v) {
  var s = stoneValue(u, v);
  var val = 120 + s * 120;
  return [val, val * 0.98, val * 0.92];
}, 1);
var stoneBumpTex = makeProceduralTexture(256, function (u, v) {
  var s = stoneValue(u, v) * 255;
  return [s, s, s];
}, 1);

/* rock: coarse fbm for the island underside + boulders */
var rockTex = makeProceduralTexture(256, function (u, v) {
  var n = fbm(u * 5, v * 5, 5);
  var val = 105 + n * 115;
  return [val, val * 0.96, val * 0.9];
}, 3);

/* ---------------------------------------------------------------------
   1. Scene / camera / renderer
--------------------------------------------------------------------- */
/* quality tiers: phones/tablets get lighter everything; desktops can
   still step resolution down at runtime if the frame rate dips */
var IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
  (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 820);
var QUALITY = {
  pixelRatioCap: IS_MOBILE ? 1.5 : 2,
  shadowSize: IS_MOBILE ? 1024 : 2048,
  anisotropy: IS_MOBILE ? 2 : 8,
  tufts: IS_MOBILE ? 900 : 2400,
  clouds: IS_MOBILE ? 130 : 260,
  cloudCollar: IS_MOBILE ? 45 : 90,
  envSize: IS_MOBILE ? 32 : 64,
  envInterval: IS_MOBILE ? 5 : 2.5,
  lanternLights: !IS_MOBILE // point lights are the priciest thing in the scene
};

var scene = new THREE.Scene();
var skyColorTop = new THREE.Color('#1c2740');
var skyColorBottom = new THREE.Color('#7a8fae');
scene.fog = new THREE.FogExp2('#41506e', 0.011);

var camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 800);

var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, QUALITY.pixelRatioCap));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (THREE.ACESFilmicToneMapping) renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

var maxAniso = renderer.capabilities.getMaxAnisotropy();
PROC_TEXTURES.forEach(function (tx) { tx.anisotropy = Math.min(QUALITY.anisotropy, maxAniso); });

function makeSkyDome() {
  var geo = new THREE.SphereGeometry(500, 32, 16);
  var mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: { topColor: { value: skyColorTop.clone() }, bottomColor: { value: skyColorBottom.clone() } },
    vertexShader:
      'varying vec3 vWorldPos;' +
      'void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vWorldPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }',
    fragmentShader:
      'varying vec3 vWorldPos; uniform vec3 topColor; uniform vec3 bottomColor;' +
      'void main(){ float h = normalize(vWorldPos).y * 0.5 + 0.5; gl_FragColor = vec4(mix(bottomColor, topColor, pow(max(h,0.0), 0.55)), 1.0); }'
  });
  return new THREE.Mesh(geo, mat);
}
var sky = makeSkyDome();
scene.add(sky);

/* stars (visible at night) */
var starGeo = new THREE.BufferGeometry();
var STAR_COUNT = 500;
var starPos = new Float32Array(STAR_COUNT * 3);
for (var si = 0; si < STAR_COUNT; si++) {
  var su = Math.random() * Math.PI * 2, sv = Math.acos(Math.random() * 0.85);
  var sr = 400;
  starPos[si * 3] = sr * Math.sin(sv) * Math.cos(su);
  starPos[si * 3 + 1] = Math.abs(sr * Math.cos(sv)) * 0.9 + 30;
  starPos[si * 3 + 2] = sr * Math.sin(sv) * Math.sin(su);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
var starMat = new THREE.PointsMaterial({ color: '#ffffff', size: 1.4, transparent: true, opacity: 0, depthWrite: false });
var stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

/* moon sprite */
function makeGlowTexture(color) {
  var size = 128;
  var c = document.createElement('canvas'); c.width = c.height = size;
  var ctx = c.getContext('2d');
  var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, color); grad.addColorStop(0.4, color); grad.addColorStop(1, 'rgba(255,255,255,0)');

function edgeFallOf(x, z) {
  var r = Math.sqrt(x * x + z * z);
  var dist = Math.min(1, r / ISLAND_RADIUS);
  return Math.pow(Math.max(0, 1 - dist), 1.3);
}
function smoothHeight(x, z) {
  var base = fbm(x * 0.025, z * 0.025, 3) * 1.6 - 0.3;
  return base * edgeFallOf(x, z);

function flattenWeight(x, z) {
  var w = 0, y = 0;
  for (var i = 0; i < FLATTEN_CENTERS.length; i++) {
    var c = FLATTEN_CENTERS[i];
    var dx = x - c.x, dz = z - c.z;
    var d = Math.sqrt(dx * dx + dz * dz);
    var t = Math.pow(Math.max(0, 1 - d / c.r), 2);
    if (t > w) { w = t; y = c.y; }
  }
  return { w: w, y: y };
}

function islandHeight(x, z) {
  var base = fbm(x * 0.025, z * 0.025, 3) * 1.6 - 0.3;
  var detail = fbm(x * 0.09 + 40, z * 0.09 + 40, 4) * 0.9;
  var h = (base + detail * 0.55) * edgeFallOf(x, z);
  var fw = flattenWeight(x, z);

}

function buildVillageMST(nodes) {
  var n = nodes.length;
  var inTree = new Array(n).fill(false);
  var parent = new Array(n).fill(-1);
  var dist = new Array(n).fill(Infinity);
  dist[0] = 0;
  for (var k = 0; k < n; k++) {
    var u = -1, best = Infinity;
    for (var i = 0; i < n; i++) { if (!inTree[i] && dist[i] < best) { best = dist[i]; u = i; } }

      if (inTree[v]) continue;
      var dx = nodes[u].x - nodes[v].x, dz = nodes[u].z - nodes[v].z;

  for (var i = 0; i < pos.count; i++) {

function buildIslandUnderside() {

  geo.translate(0, -depth / 2 - 0.3, 0);

    var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    var t = THREE.MathUtils.clamp((-y) / depth, 0, 1);
    var n = fbm(x * 0.1 + 40, z * 0.1 + 40, 4);
    var bulge = (n - 0.5) * 2.6 * (1 - t * 0.4);
    var len = Math.sqrt(x * x + z * z) || 1;

  for (var i = 0; i < p.count; i++) {

  var dummy = new THREE.Object3D();

  while (placed < ROCK_COUNT && tries < ROCK_COUNT * 60) {

    var a = Math.random() * Math.PI * 2;

  for (var j = placed; j < ROCK_COUNT; j++) rockMesh.setMatrixAt(j, hideDummy.matrix);

function makeBubbleSprite() {
  var canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 96;
  var tex = new THREE.CanvasTexture(canvas);
  var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  var sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.9, 0.57, 1);
  sprite.position.y = 2.05;
  sprite.visible = false;
  sprite.renderOrder = 999;
  function setText(text) {
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var padX = 18;
    ctx.font = '28px system-ui, sans-serif';
    var words = text.split(' ');
    var lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > canvas.width - padX * 2 && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    var lineH = 32;
    var boxH = lines.length * lineH + 26;
    var boxY = canvas.height - boxH;
    ctx.fillStyle = 'rgba(19,17,23,0.72)';
    ctx.strokeStyle = 'rgba(243,237,226,0.35)';
    ctx.lineWidth = 2;
    roundRect(ctx, 4, boxY, canvas.width - 8, boxH - 6, 12);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f3ede2';
    ctx.textBaseline = 'middle';
    lines.forEach(function (ln, li) {
      ctx.fillText(ln, padX, boxY + 18 + li * lineH);
    });
    tex.needsUpdate = true;
  }
  function roundRect(ctx, x, y, w, hgt, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + hgt, r);
    ctx.arcTo(x + w, y + hgt, x, y + hgt, r);
    ctx.arcTo(x, y + hgt, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  return { sprite: sprite, setText: setText };
}

function updateVillagers(dt) {
  for (var i = 0; i < villagers.length; i++) {
    var v = villagers[i];
    if (v.state === 'walk') {
      var wp = WAYPOINTS[v.targetIdx];
      var dx = wp.x - v.x, dz = wp.z - v.z;
      var dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < 0.45) {
        v.state = 'idle';
        v.idleTimer = 2 + Math.random() * 4;
        if (Math.random() < 0.4) triggerSoloBubble(v);
      } else {
        var nx = dx / dist, nz = dz / dist;
        v.x += nx * v.speed * dt;
        v.z += nz * v.speed * dt;
        v.heading = Math.atan2(nx, nz);
        v.walkPhase += dt * 7;
        var swing = Math.sin(v.walkPhase) * 0.5;
        v.mesh.userData.legL.rotation.x = swing;
        v.mesh.userData.legR.rotation.x = -swing;
      }
    } else {
      v.idleTimer -= dt;
      v.mesh.userData.legL.rotation.x = THREE.MathUtils.lerp(v.mesh.userData.legL.rotation.x, 0, dt * 4);
      v.mesh.userData.legR.rotation.x = THREE.MathUtils.lerp(v.mesh.userData.legR.rotation.x, 0, dt * 4);
      if (v.idleTimer <= 0) {
        var next = Math.floor(Math.random() * WAYPOINTS.length);
        v.targetIdx = next;
        v.state = 'walk';
      }
    }
    if (v.bubbleTimer > 0) {
      v.bubbleTimer -= dt;
      if (v.bubbleTimer <= 0) v.bubble.sprite.visible = false;
    }
    var gy = islandHeight(v.x, v.z);
    v.mesh.position.set(v.x, gy, v.z);
    var targetRotY = v.heading;
    var curY = v.mesh.rotation.y;
    var diff = ((targetRotY - curY + Math.PI) % (Math.PI * 2)) - Math.PI;
    v.mesh.rotation.y += diff * Math.min(1, dt * 6);
  }
  /* pairwise talking chance */
  talkCheckTimer -= dt;
  if (talkCheckTimer <= 0) {
    talkCheckTimer = 1.1;
    for (var a = 0; a < villagers.length; a++) {

        if (vb.state !== 'idle' || vb.bubbleTimer > 0) continue;
        var ddx = va.x - vb.x, ddz = va.z - vb.z;
        if (Math.sqrt(ddx * ddx + ddz * ddz) < 2.4 && Math.random() < 0.35) {
          var line1 = GREETING_PAIR[Math.floor(Math.random() * GREETING_PAIR.length)];
          var line2 = GREETING_PAIR[Math.floor(Math.random() * GREETING_PAIR.length)];
          showBubble(va, line1, 3.5);

          va.idleTimer = Math.max(va.idleTimer, 3.6);

function makeCloudTexture() {
  /* radial falloff shaped by fbm so sprites read as puffy vapour, not blobs */
  var size = 256;
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var ctx = c.getContext('2d');
  var img = ctx.createImageData(size, size);
  var d = img.data;
  for (var y = 0; y < size; y++) {
    for (var x = 0; x < size; x++) {
      var u = x / size - 0.5, v = y / size - 0.5;
      var dist = Math.sqrt(u * u + v * v) * 2;
      var falloff = Math.max(0, 1 - dist);
      var n = fbm(u * 6 + 3, v * 6 + 3, 4);
      var alpha = Math.pow(falloff, 1.6) * (0.35 + n * 0.85);
      var i = (y * size + x) * 4;
      d[i] = d[i + 1] = d[i + 2] = 255;
      d[i + 3] = Math.min(255, alpha * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
}

/* ---------------------------------------------------------------------
   12. Real-time day / night system + watch widget
--------------------------------------------------------------------- */
var groundDayTint = new THREE.Color('#ffffff');
var groundNightTint = new THREE.Color('#404a66');

var digitalTimeEl = document.getElementById('digital-time');
var digitalDateEl = document.getElementById('digital-date');
var daynightLabelEl = document.getElementById('daynight-label');

var handMin = document.getElementById('hand-min');
var handSec = document.getElementById('hand-sec');

var dayFactor = 1; // smoothed 0..1, updated each frame

function updateDayNight() {
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes(), sSec = now.getSeconds();
  var hourFloat = h + m / 60 + sSec / 3600;
  var elevation = Math.sin(2 * Math.PI * (hourFloat - 6) / 24); // -1..1, 1 at noon

  var targetDayT = THREE.MathUtils.clamp((elevation + 0.18) / 0.36, 0, 1);
  dayFactor = targetDayT;

  var azimuth = 2 * Math.PI * (hourFloat / 24);
  var elevAngle = elevation * (Math.PI / 2);
  var R = 90;
  var sx = Math.cos(azimuth) * Math.cos(elevAngle) * R;
  var sy = Math.sin(elevAngle) * R + 20;
  var sz = Math.sin(azimuth) * Math.cos(elevAngle) * R;
  sun.position.set(sx, Math.max(sy, -40), sz);
  sun.target.position.set(0, 0, 0);
  sunSprite.position.set(sx, sy, sz);
  sunSprite.material.opacity = THREE.MathUtils.clamp(elevation + 0.3, 0, 1);

  moonSprite.position.set(-sx, -sy + 40, -sz);
  moonLight.position.set(-sx, Math.max(-sy, -40) + 40, -sz);
  moonLight.target.position.set(0, 0, 0);
  var nightAmt = 1 - dayFactor;
  moonLight.intensity = nightAmt * 0.45;
  moonSprite.material.opacity = nightAmt * 0.9;

  sun.intensity = THREE.MathUtils.clamp(elevation, 0, 1) * 1.6 + 0.05;

  var st = smoothT(dayFactor);
  var seasonDayTop = seasonLerp('dayTop').clone(), seasonNightTop = seasonLerp('nightTop').clone();
  var seasonDayBottom = seasonLerp('dayBottom').clone(), seasonNightBottom = seasonLerp('nightBottom').clone();
  var seasonFogDay = seasonLerp('fogDay').clone(), seasonFogNight = seasonLerp('fogNight').clone();
  var seasonSunDay = seasonLerp('sunDay').clone(), seasonSunNight = seasonLerp('sunNight').clone();

  sky.material.uniforms.topColor.value.copy(seasonNightTop).lerp(seasonDayTop, st);
  sky.material.uniforms.bottomColor.value.copy(seasonNightBottom).lerp(seasonDayBottom, st);
  scene.fog.color.copy(seasonFogNight).lerp(seasonFogDay, st);
  sun.color.copy(seasonSunNight).lerp(seasonSunDay, st);

  var seasonGroundTint = groundSeasonTint[fromSeason].clone().lerp(groundSeasonTint[currentSeason], smoothT(seasonT));
  islandTop.material.color.copy(groundNightTint).lerp(groundDayTint, st).multiply(seasonGroundTint);
  hemi.intensity = 0.25 + st * 0.4;

  starMat.opacity = nightAmt * 0.85;

  if (bloomPass) bloomPass.strength = 0.22 + nightAmt * 0.55;

  var lanternOn = THREE.MathUtils.clamp(1 - (dayFactor - 0.15) / 0.3, 0, 1);
  var emissiveBoost = QUALITY.lanternLights ? 1.1 : 1.7; // no point lights → let bloom carry the glow
  lanterns.forEach(function (lt) {
    lt.userData.glowMat.emissiveIntensity = 0.1 + lanternOn * emissiveBoost;
    if (lt.userData.glowLight) lt.userData.glowLight.intensity = lanternOn * 2.0;
  });
  var shrineGlowT = 0.4 + lanternOn * 0.9;
  POIS.forEach(function (p) {
    if (p.shrine && p.shrine.userData.innerGlow) p.shrine.userData.innerGlow.emissiveIntensity = shrineGlowT;
  });

  /* watch face */
  var hourAngle = ((h % 12) + m / 60) * 30;
  var minAngle = (m + sSec / 60) * 6;
  var secAngle = sSec * 6;
  handHour.setAttribute('transform', 'rotate(' + hourAngle + ' 50 50)');
  handMin.setAttribute('transform', 'rotate(' + minAngle + ' 50 50)');
  handSec.setAttribute('transform', 'rotate(' + secAngle + ' 50 50)');

  var hh = h % 12; if (hh === 0) hh = 12;
  var ampm = h >= 12 ? 'PM' : 'AM';
  var mm = m < 10 ? '0' + m : '' + m;
  var ssTxt = sSec < 10 ? '0' + sSec : '' + sSec;
  digitalTimeEl.textContent = hh + ':' + mm + ':' + ssTxt + ' ' + ampm;
  var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  digitalDateEl.textContent = days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()];
  daynightLabelEl.textContent = dayFactor > 0.85 ? 'Day' : (dayFactor < 0.15 ? 'Night' : (elevation > 0 ? 'Dawn' : 'Dusk'));
}

function sphericalToPos(target, distance, theta, phi, out) {
  out.set(
    target.x + distance * Math.sin(phi) * Math.cos(theta),
    target.y + distance * Math.cos(phi),
    target.z + distance * Math.sin(phi) * Math.sin(theta)
  );
  return out;
}

  camera.lookAt(camTarget);

    toPos: toPos.clone(), toTarget: toTarget.clone(),

renderer.domElement.addEventListener('pointerdown', function (e) {

  if (!dragging) return;
  autoRotate = false;
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  camTheta -= dx * 0.0055;
  camPhi = THREE.MathUtils.clamp(camPhi - dy * 0.0055, 0.3, 1.48);

});

var lastTouchDist = null;
renderer.domElement.addEventListener('touchstart', function (e) {
  if (e.touches.length === 1) {
    dragging = true; autoRotate = false;
    lastPX = e.touches[0].clientX; lastPY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    dragging = false;
    var dx0 = e.touches[0].clientX - e.touches[1].clientX;
    var dy0 = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.sqrt(dx0 * dx0 + dy0 * dy0);
  }

  if (e.touches.length === 1 && dragging) {
    var dx = e.touches[0].clientX - lastPX, dy = e.touches[0].clientY - lastPY;
    camTheta -= dx * 0.0055;
    camPhi = THREE.MathUtils.clamp(camPhi - dy * 0.0055, 0.3, 1.48);
    lastPX = e.touches[0].clientX; lastPY = e.touches[0].clientY;
  } else if (e.touches.length === 2 && lastTouchDist !== null) {
    var dx1 = e.touches[0].clientX - e.touches[1].clientX;
    var dy1 = e.touches[0].clientY - e.touches[1].clientY;
    var dist = Math.sqrt(dx1 * dx1 + dy1 * dy1);
    camDistance = THREE.MathUtils.clamp(camDistance - (dist - lastTouchDist) * 0.03, 10, 70);
    lastTouchDist = dist;
  }
}, { passive: true });

  if (e.touches.length === 0) { dragging = false; lastTouchDist = null; }

var raycaster = new THREE.Raycaster();
var pointer = new THREE.Vector2();
renderer.domElement.addEventListener('click', function (e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  var gateHits = raycaster.intersectObjects(POIS.map(function (p) { return p.gate; }).concat(POIS.map(function (p) { return p.shrine; })), true);
  if (gateHits.length) {
    var obj = gateHits[0].object;
    for (var i = 0; i < POIS.length; i++) {
      if (isDescendant(POIS[i].gate, obj) || isDescendant(POIS[i].shrine, obj)) { openPOI(POIS[i]); return; }
    }
  }
  var npcHits = raycaster.intersectObjects(villagers.map(function (v) { return v.mesh; }), true);
  if (npcHits.length) {
    var nobj = npcHits[0].object;
    for (var j = 0; j < villagers.length; j++) {
      if (isDescendant(villagers[j].mesh, nobj)) { openVillager(villagers[j]); return; }
    }
  }
  if (currentOpen) closeOpen();
});
function isDescendant(parent, obj) {
  var o = obj;
  while (o) { if (o === parent) return true; o = o.parent; }
  return false;
}

  composer.addPass(new THREE.RenderPass(scene, camera));
  var bloomRes = IS_MOBILE ? new THREE.Vector2(innerWidth / 2, innerHeight / 2) : new THREE.Vector2(innerWidth, innerHeight);
  bloomPass = new THREE.UnrealBloomPass(bloomRes, 0.35, 0.65, 0.78);
  composer.addPass(bloomPass);
  composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
  var vignettePass = new THREE.ShaderPass(THREE.VignetteShader);
  vignettePass.uniforms.offset.value = 0.92;
  vignettePass.uniforms.darkness.value = 1.08;
  composer.addPass(vignettePass);
}

/* ---------------------------------------------------------------------
   14c. Adaptive resolution — if the frame rate dips, render at a lower
        internal resolution and scale back up when there's headroom
--------------------------------------------------------------------- */
var renderScale = 1, fpsAccum = 0, fpsFrames = 0, fpsLastCheck = 0;
function applyRenderScale() {
  var pr = Math.min(devicePixelRatio, QUALITY.pixelRatioCap) * renderScale;
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight); }
}
function updateAdaptiveResolution(t, rawDt) {
  fpsAccum += rawDt; fpsFrames++;
  if (t - fpsLastCheck < 2 || fpsAccum <= 0) return;
  var fps = fpsFrames / fpsAccum;
  fpsLastCheck = t; fpsAccum = 0; fpsFrames = 0;
  if (fps < 42 && renderScale > 0.55) { renderScale = Math.max(0.55, renderScale - 0.15); applyRenderScale(); }
  else if (fps > 56 && renderScale < 1) { renderScale = Math.min(1, renderScale + 0.15); applyRenderScale(); }
}

/* ---------------------------------------------------------------------
   15. Resize
--------------------------------------------------------------------- */
window.addEventListener('resize', function () {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  applyRenderScale();
});

/* ---------------------------------------------------------------------
   16. Animate
--------------------------------------------------------------------- */
var clock = new THREE.Clock();
var _vec = new THREE.Vector3();

function projectToScreen(worldPos) {
  _vec.copy(worldPos);
  var projected = _vec.project(camera);
  var behind = projected.z > 1;
  /* measure the canvas itself — on mobile the URL bar collapsing makes
     innerWidth/innerHeight disagree with the rendered canvas size */
  var w = renderer.domElement.clientWidth || innerWidth;
  var h = renderer.domElement.clientHeight || innerHeight;
  var x = (projected.x * 0.5 + 0.5) * w;
  var y = (-projected.y * 0.5 + 0.5) * h;
  return { x: x, y: y, behind: behind, w: w, h: h };
}

function updatePoiLabels() {
  for (var i = 0; i < POIS.length; i++) {
    var wp = POIS[i].worldPos.clone();
    islandGroup.localToWorld(wp);
    var p = projectToScreen(wp);
    var el = poiLabelEls[i];
    var hideForOpen = currentOpen && currentOpen === POIS[i];
    if (p.behind || p.x < -50 || p.x > p.w + 50 || hideForOpen) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; }
    else {
      var lx = p.x, ly = p.y;
      if (IS_MOBILE) { /* keep chips fully on-screen and reachable */
        var half = (el.offsetWidth || 120) / 2 + 8;
        lx = Math.max(half, Math.min(p.w - half, lx));
        ly = Math.max(110, Math.min(p.h - 90, ly));
      }
      el.style.opacity = '1'; el.style.pointerEvents = 'auto';
      el.style.left = lx + 'px'; el.style.top = ly + 'px';
    }
  }
}

var dtClamp = 0.05;
function animate() {
  requestAnimationFrame(animate);
  var rawDt = clock.getDelta();
  var dt = Math.min(rawDt, dtClamp);
  var t = clock.elapsedTime;
  updateAdaptiveResolution(t, rawDt);

  applySeasonTransition(dt);
  updateSeasonParticles(t);
  updateDayNight();
  updateVillagers(dt);

  for (var ci2 = 0; ci2 < cloudData.length; ci2++) {
    var cd = cloudData[ci2];
    cd.baseA += cd.speed * dt * 0.2;
    var s2 = cd.sprite;
    s2.position.x = Math.cos(cd.baseA) * cd.r;
    s2.position.z = Math.sin(cd.baseA) * cd.r;
    s2.position.y += Math.sin(t * cd.ySpeed + cd.phase) * 0.003;
  }
  lowCloud.rotation.y += dt * 0.006;

  islandGroup.position.y = Math.sin(t * 0.22) * 0.18;

  if (flight) {
    var ft = (t - flight.start) / flight.duration;
    if (ft >= 1) ft = 1;
    var e = smoothT(ft);
    camera.position.lerpVectors(flight.fromPos, flight.toPos, e);
    camTarget.lerpVectors(flight.fromTarget, flight.toTarget, e);
    camera.lookAt(camTarget);
    if (ft >= 1) {
      var rel = camera.position.clone().sub(camTarget);
      camDistance = rel.length();
      camPhi = Math.acos(THREE.MathUtils.clamp(rel.y / camDistance, -1, 1));
      camTheta = Math.atan2(rel.z, rel.x);
      flight = null;
    }
  } else {
    if (autoRotate) camTheta += dt * 0.07;
    updateCameraFromSpherical();
  }

  updatePoiLabels();
  updateEnvironment(t);
  if (composer) composer.render();
  else renderer.render(scene, camera);
}

/* ---------------------------------------------------------------------
   17. Boot
--------------------------------------------------------------------- */
setSeason('spring');
seasonT = 1;
applySeasonTransition(0);
updateDayNight();
updateCameraFromSpherical();
setTimeout(function () { document.getElementById('loading').classList.add('hidden'); }, 700);
setTimeout(function () { hint.classList.add('hidden'); }, 7000);

animate();

} catch (err) {
  var el2 = document.getElementById('loading-err');
  if (el2) el2.textContent = 'Error: ' + err.message;
  console.error(err);
}
</script>
